[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "neonrecall"
version = "0.1.0"
description = "Hybrid-retrieval RAG service with citations: FastAPI, CLI and MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "synthalorian" }]
requires-python = ">=3.11"
keywords = ["rag", "retrieval", "pgvector", "bm25", "mcp", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
]
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
neonrecall = "neonrecall.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neonrecall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: needs a live PostgreSQL+pgvector (set NEONRECALL_TEST_PG_DSN)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
