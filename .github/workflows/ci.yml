name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest
      - name: Retrieval eval
        run: neonrecall eval --min-recall 0.9 --min-mrr 0.85

  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: neonrecall
          POSTGRES_PASSWORD: neonrecall
          POSTGRES_DB: neonrecall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neonrecall"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NEONRECALL_TEST_PG_DSN: postgresql://neonrecall:neonrecall@localhost:5432/neonrecall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,postgres]"
      - name: pgvector tests
        run: pytest -m postgres
